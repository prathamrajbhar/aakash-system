# Aakash behind a Cloudflare Tunnel: nothing is published to the internet or the LAN.
#
#   cp .env.cloudflare.example .env      # then fill it in
#   docker compose -f docker-compose.cloudflare.yml up -d --build
#
# This is a standalone stack. Use it INSTEAD of docker-compose.yml, not together with it.
# Setup guide: docs/DEPLOY-CLOUDFLARE.md
#
# Public hostnames the tunnel must route:
#   aakash.<domain>  ->  dashboard   protect with a Cloudflare Access application
#   api.<domain>     ->  gateway     NO Access policy: callers sign with SigV4
#   files.<domain>   ->  gateway     NO Access policy: anonymous read of public buckets only
#
# Two ways to run the tunnel:
#   * Tunnel already runs on this host (systemd): point its ingress at 127.0.0.1:3050 (dashboard)
#     and 127.0.0.1:4567 (gateway). Nothing else to do; the cloudflared service below stays off.
#   * Dedicated tunnel in Docker: set TUNNEL_TOKEN and start with `--profile tunnel`; then use the
#     Docker names http://dashboard:3050 and http://gateway:4567 as the tunnel's service URLs.

services:
  aakash:
    # Bundled emulator engine. Set AAKASH_EMULATOR_IMAGE to run your own build.
    image: ${AAKASH_EMULATOR_IMAGE:-floci/floci:latest}
    container_name: aakash
    restart: unless-stopped
    ports:
      # Loopback only: for admin work on this server. The tunnel reaches the emulator
      # over the Docker network, so none of these are reachable from outside.
      - "127.0.0.1:4566:4566"
      - "127.0.0.1:7001-7069:7001-7069" # RDS proxy ports
      - "127.0.0.1:7071-7099:7071-7099" # RDS proxy ports (7070 skipped to avoid a host conflict)
      - "127.0.0.1:6380-6399:6380-6399" # ElastiCache proxy ports
    volumes:
      - ${AAKASH_HOST_DATA_PATH:-./aakash-data}:/var/lib/floci
      - ${AAKASH_HOST_DATA_PATH:-./aakash-data}:/app/data
      # Gives the emulator control of Docker (it starts the database containers), which is
      # root-equivalent on this host. That is why the emulator is only reachable through the gateway.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /var/lib/floci
      FLOCI_SERVICES_DOCKER_NETWORK: aakash_default
      SERVICES_RDS_DEFAULT_POSTGRES_IMAGE: pgvector/pgvector:pg16
      FLOCI_SERVICES_RDS_DEFAULT_POSTGRES_IMAGE: pgvector/pgvector:pg16
      # Verify the SigV4 signature of every signed request and refuse unsigned S3 object
      # reads. The gateway adds the rest (unsigned requests, the dev key, admin paths).
      FLOCI_AUTH_VALIDATE_SIGNATURES: "true"
      FLOCI_SERVICES_S3_ENFORCE_AUTH: "true"

  gateway:
    build:
      context: ./gateway
    container_name: aakash-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:4567:4567" # loopback only, for a tunnel running on this host
    environment:
      GATEWAY_UPSTREAM: http://aakash:4566
      # Access keys created with scripts/create-api-key.sh (or the dashboard) are listed here.
      GATEWAY_KEYS_FILE: /data/api-keys.json
      GATEWAY_ACCESS_KEY_IDS: ${GATEWAY_ACCESS_KEY_IDS:-}
      # Requests for this hostname get anonymous, read-only access to public buckets.
      GATEWAY_FILES_HOST: ${AAKASH_FILES_HOSTNAME:-}
    volumes:
      - ./aakash-dashboard-data:/data:ro
    depends_on:
      - aakash

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aakash-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:3050:3050" # loopback only, for debugging over SSH
    environment:
      AAKASH_ENDPOINT: http://aakash:4566
      # Every request must carry a valid Cloudflare Access token. While CF_ACCESS_* is empty the
      # dashboard answers 503 to everything (fails closed) instead of opening up.
      AAKASH_AUTH_MODE: ${AAKASH_AUTH_MODE:-cloudflare}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      AAKASH_ALLOWED_EMAILS: ${AAKASH_ALLOWED_EMAILS:-}
      # What the console prints in copyable snippets.
      AAKASH_PUBLIC_HOST: ${AAKASH_API_HOSTNAME:?Set AAKASH_API_HOSTNAME in .env}
      AAKASH_PUBLIC_PROTOCOL: https
      AAKASH_API_PORT: "443"
      # "Reset all state" is off on a public deployment unless you turn it on.
      AAKASH_ALLOW_RESET: ${AAKASH_ALLOW_RESET:-false}
    volumes:
      - ./aakash-dashboard-data:/app/data
      - ${AAKASH_HOST_DATA_PATH:-./aakash-data}:/var/lib/floci:ro
    depends_on:
      - aakash

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: aakash-cloudflared
    restart: unless-stopped
    profiles: ["tunnel"] # off unless you run `docker compose --profile tunnel up`
    command: tunnel --no-autoupdate run
    environment:
      # A dedicated tunnel for Aakash. Treat the token like a password: anyone holding it can run the tunnel.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - dashboard
      - gateway

networks:
  default:
    name: aakash_default
